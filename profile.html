<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Το Προφίλ μου - Ο Tee mou</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="announcement-bar">🚚 ΔΩΡΕΑΝ ΜΕΤΑΦΟΡΙΚΑ ΓΙΑ ΠΑΡΑΓΓΕΛΙΕΣ ΑΝΩ ΤΩΝ €50</div>

    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">🛒 Ο Tee mou<span class="logo-sub">ti agorasa pali</span></a>
            <div class="header-actions" style="margin-left:auto;">
                <a href="index.html" class="header-btn"><span class="icon">🏠</span><span>Αρχική</span></a>
                <a href="cart.html" class="header-btn"><span class="icon">🛒</span><span>Καλάθι</span><span class="cart-count" style="display:none;">0</span></a>
            </div>
        </div>
    </header>

    <div class="page-container">
        <div class="profile-card" id="profile-card">
            <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <div><h3>🛒 Ο Tee mou</h3><p style="font-size:13px;">Η πιο απίστευτη εμπειρία αγορών!</p></div>
            <div><h3>Εξυπηρέτηση</h3><ul><li>📞 24/7 Υποστήριξη</li><li>📧 info@teemou.gr</li></ul></div>
        </div>
        <div class="footer-bottom"><p>© 2026 Ο Tee mou, ti agorasa pali - Ψεύτικο κατάστημα 😉</p></div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/store.js"></script>
    <script src="js/promos.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = Store.getUser();
            const card = document.getElementById('profile-card');
            
            if (!user) {
                card.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👤</div>
                        <h2>Δεν έχεις συνδεθεί</h2>
                        <p>Δημιούργησε ένα ψεύτικο προφίλ για να ξεκινήσεις!</p>
                        <a href="login.html" class="btn-primary">🚀 Είσοδος</a>
                    </div>
                `;
                return;
            }
            
            card.innerHTML = `
                <div class="profile-avatar">${user.name.charAt(0).toUpperCase()}</div>
                <h2 style="text-align:center;margin-bottom:20px;">${user.name}</h2>
                <div style="border-top:1px solid var(--gray-200);padding-top:20px;">
                    <div class="form-group">
                        <label>📧 Email</label>
                        <div style="padding:12px 16px;background:var(--gray-100);border-radius:var(--radius-sm);">${user.email}</div>
                    </div>
                    <div class="form-group">
                        <label>📍 Διεύθυνση</label>
                        <div style="padding:12px 16px;background:var(--gray-100);border-radius:var(--radius-sm);">${user.address}</div>
                    </div>
                    <div class="form-group">
                        <label>📞 Τηλέφωνο</label>
                        <div style="padding:12px 16px;background:var(--gray-100);border-radius:var(--radius-sm);">${user.phone}</div>
                    </div>
                </div>
                <div style="display:flex;gap:10px;margin-top:20px;">
                    <a href="orders.html" class="btn-primary" style="flex:1;text-align:center;">📦 Παραγγελίες</a>
                    <button class="btn-secondary" onclick="logout()" style="flex:1;">🚪 Αποσύνδεση</button>
                </div>
            `;
        });
        
        function logout() {
            if (confirm('Σίγουρα θέλεις να αποσυνδεθείς;')) {
                Store.remove('user');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
